name: Strozz
options:
  # New app identity; the legacy Twozz app remains a separate installation.
  bundleIdPrefix: com.thatcube.Strozz
  deploymentTarget:
    tvOS: "18.0"
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.47.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: Strozz/App/Info.plist
    TARGETED_DEVICE_FAMILY: "3" # Apple TV
    STROZZ_ICLOUD_ENVIRONMENT: Development
    STROZZ_APS_ENVIRONMENT: development
  configs:
    Release:
      STROZZ_ICLOUD_ENVIRONMENT: Production
      STROZZ_APS_ENVIRONMENT: production
configFiles:
  Debug: Config/Development.xcconfig
  Release: Config/Release.xcconfig
packages:
  SDWebImage:
    url: https://github.com/SDWebImage/SDWebImage.git
    from: 5.21.0
  SDWebImageSwiftUI:
    url: https://github.com/SDWebImage/SDWebImageSwiftUI.git
    from: 3.1.3
  SDWebImageWebPCoder:
    url: https://github.com/SDWebImage/SDWebImageWebPCoder.git
    from: 0.14.6
targets:
  StrozzMobile:
    type: application
    platform: iOS
    sources:
      - path: StrozzMobile
      - path: Strozz/Assets.xcassets
      - path: Strozz/Models
      - path: Strozz/Resources/Fonts
      - path: Strozz/Services
        includes:
          - "BrowseService.swift"
          - "SearchService.swift"
          - "RecommendationsService.swift"
          - "PersonalizedRecommendationsService.swift"
          - "WatchHistoryService.swift"
          - "RecommendationFeedbackService.swift"
          - "SimilarChannelsEngine.swift"
          - "StreamerAffinityService.swift"
          - "ChannelContentService.swift"
          - "ChannelProfileService.swift"
          - "FollowedChannels*.swift"
          - "TwitchAuthSession*.swift"
          - "TwitchAccountSync.swift"
          - "TwitchCloud*.swift"
          - "CloudKitTwitchDatabase.swift"
          - "TwitchWatchRewards*.swift"
          - "TwitchWatchTracker.swift"
          - "TwitchChannelRewards*.swift"
          - "PlaybackTelemetry*.swift"
          - "PlaybackAudioSession.swift"
          - "PlaybackReturnRefreshCoordinator.swift"
          - "PlaybackPositionRestoration.swift"
          - "TwitchYouTubeAliasService.swift"
          - "YouTubeLiveSnapshotService.swift"
          - "YouTubeConcurrentViewersService.swift"
          - "Chat*.swift"
          - "BadgeCatalogService.swift"
          - "EmoteCatalogService.swift"
          - "CheermoteCatalogService.swift"
          - "WebSocketService.swift"
          - "PlaybackService.swift"
          - "Native*.swift"
          - "LowLatencyHLSProxy.swift"
          - "LiveChatSyncBaseline.swift"
      - path: Strozz/Shared
        includes:
          - "NetworkClient.swift"
          - "TwitchAPIClient.swift"
          - "TwitchConfig.swift"
          - "YouTubeConfig.swift"
          - "PersistenceKeys.swift"
          - "BoundedCache.swift"
          - "CachedAsyncImage.swift"
          - "Theme.swift"
          - "CardMetrics.swift"
          - "LoadingSkeleton.swift"
          - "TopShelfStore.swift"
          - "TopShelfCredentialStore.swift"
          - "CredentialKeychain.swift"
          - "TopShelfSnapshot.swift"
      - path: Strozz/Views/Icon.swift
      - path: Strozz/Views/StreamLoadingView.swift
      - path: Strozz/Views/BroadcastUptimeView.swift
      - path: Strozz/Views/TwitchICloudSyncControls.swift
      - path: Strozz/Resources/StreamerAffinity.json
      - path: Strozz/Views/RichChatLineView.swift
      - path: Strozz/Views/Chat/ChatColor.swift
    dependencies:
      - package: SDWebImage
        product: SDWebImage
      - package: SDWebImageSwiftUI
        product: SDWebImageSwiftUI
      - package: SDWebImageWebPCoder
        product: SDWebImageWebPCoder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thatcube.Strozz
        PRODUCT_NAME: StrozzMobile
        DEVELOPMENT_TEAM: N8Z5T4AK3X
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Strozz/App/Strozz.entitlements
        INFOPLIST_FILE: StrozzMobile/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: MobileAppIcon
      configs:
        Debug:
          "CODE_SIGN_STYLE[sdk=iphoneos*]": "$(STROZZ_IOS_DEBUG_SIGNING_STYLE)"
          "CODE_SIGN_IDENTITY[sdk=iphoneos*]": "Apple Development"
          "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": "$(STROZZ_IOS_DEBUG_APP_PROFILE)"
        Release:
          "CODE_SIGN_STYLE[sdk=iphoneos*]": "$(STROZZ_RELEASE_SIGNING_STYLE)"
          "CODE_SIGN_IDENTITY[sdk=iphoneos*]": "Apple Distribution"
          "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": "$(STROZZ_IOS_RELEASE_APP_PROFILE)"
  StrozzMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StrozzMobileTests
      - path: StrozzTests/PlaybackPresentationStateTests.swift
      - path: StrozzTests/NativeRenditionReportTests.swift
      - path: StrozzTests/NativeTransportStreamTests.swift
      - path: StrozzTests/NativeBufferedStallRecoveryTests.swift
      - path: StrozzTests/NativeHLSChunkReaderTests.swift
      - path: StrozzTests/NativePreviewTests.swift
      - path: StrozzTests/BroadcastUptimeTests.swift
      - path: StrozzTests/TwitchAutomaticSignInTests.swift
      - path: StrozzTests/FollowingRecoveryTests.swift
      - path: StrozzTests/TwitchGIFTests.swift
    dependencies:
      - target: StrozzMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thatcube.Strozz.MobileTests
        DEVELOPMENT_TEAM: N8Z5T4AK3X
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: ""
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/StrozzMobile.app/StrozzMobile"
        BUNDLE_LOADER: "$(TEST_HOST)"
  StrozzMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: StrozzMobileUITests
    dependencies:
      - target: StrozzMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thatcube.Strozz.MobileUITests
        DEVELOPMENT_TEAM: N8Z5T4AK3X
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: ""
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_TARGET_NAME: StrozzMobile
  Strozz:
    type: application
    platform: tvOS
    sources:
      - path: Strozz
    dependencies:
      - package: SDWebImage
        product: SDWebImage
      - package: SDWebImageSwiftUI
        product: SDWebImageSwiftUI
      - package: SDWebImageWebPCoder
        product: SDWebImageWebPCoder
      - target: TopShelfExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thatcube.Strozz
        DEVELOPMENT_TEAM: N8Z5T4AK3X
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Strozz/App/Strozz.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          "CODE_SIGN_STYLE[sdk=appletvos*]": "$(STROZZ_TVOS_DEBUG_SIGNING_STYLE)"
          "CODE_SIGN_IDENTITY[sdk=appletvos*]": "Apple Development"
          "PROVISIONING_PROFILE_SPECIFIER[sdk=appletvos*]": "$(STROZZ_TVOS_DEBUG_APP_PROFILE)"
        Release:
          "CODE_SIGN_STYLE[sdk=appletvos*]": "$(STROZZ_RELEASE_SIGNING_STYLE)"
          "CODE_SIGN_IDENTITY[sdk=appletvos*]": "Apple Distribution"
          "PROVISIONING_PROFILE_SPECIFIER[sdk=appletvos*]": "$(STROZZ_TVOS_RELEASE_APP_PROFILE)"
  TopShelfExtension:
    type: com.apple.product-type.tv-app-extension
    platform: tvOS
    sources:
      - path: TopShelfExtension/ContentProvider.swift
      - path: TopShelfExtension/TopShelfLiveFeed.swift
      - path: Strozz/Shared/TopShelfSnapshot.swift
      - path: Strozz/Shared/TopShelfStore.swift
      - path: Strozz/Shared/TopShelfCredentialStore.swift
      - path: Strozz/Shared/CredentialKeychain.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thatcube.Strozz.TopShelfExtension
        DEVELOPMENT_TEAM: N8Z5T4AK3X
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: TopShelfExtension/Info.plist
        # tvOS's legacy TVExtensionMain entry point (set by the
        # com.apple.product-type.tv-app-extension product type) is a no-op stub
        # in modern tvOS — it simply returns, so the extension process launched
        # and exited immediately without ever instantiating the principal class,
        # leaving the Top Shelf empty. Modern Top Shelf extensions must enter
        # through NSExtensionMain (provided by Foundation), which sets up the
        # ExtensionKit/XPC runtime and instantiates ContentProvider.
        LD_ENTRY_POINT: _NSExtensionMain
        CODE_SIGN_ENTITLEMENTS: TopShelfExtension/TopShelfExtension.entitlements
      configs:
        Debug:
          "CODE_SIGN_STYLE[sdk=appletvos*]": "$(STROZZ_TVOS_DEBUG_SIGNING_STYLE)"
          "CODE_SIGN_IDENTITY[sdk=appletvos*]": "Apple Development"
          "PROVISIONING_PROFILE_SPECIFIER[sdk=appletvos*]": "$(STROZZ_TVOS_DEBUG_TOPSHELF_PROFILE)"
        Release:
          "CODE_SIGN_STYLE[sdk=appletvos*]": "$(STROZZ_RELEASE_SIGNING_STYLE)"
          "CODE_SIGN_IDENTITY[sdk=appletvos*]": "Apple Distribution"
          "PROVISIONING_PROFILE_SPECIFIER[sdk=appletvos*]": "$(STROZZ_TVOS_RELEASE_TOPSHELF_PROFILE)"
  StrozzTests:
    type: bundle.unit-test
    platform: tvOS
    sources:
      - path: StrozzTests
    dependencies:
      - target: Strozz
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thatcube.Strozz.Tests
        DEVELOPMENT_TEAM: N8Z5T4AK3X
        CODE_SIGN_STYLE: Automatic
        # These pure-logic tests use `@testable import Strozz`, so the bundle is
        # hosted by the app. Override the project-wide Info.plist settings, which
        # point at the app's own plist, with a generated one for the test bundle.
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: ""
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Strozz.app/Strozz"
        BUNDLE_LOADER: "$(TEST_HOST)"
  StrozzUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - path: StrozzUITests
    dependencies:
      - target: Strozz
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thatcube.Strozz.UITests
        DEVELOPMENT_TEAM: N8Z5T4AK3X
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: ""
        TARGETED_DEVICE_FAMILY: "3"
        TEST_TARGET_NAME: Strozz

schemes:
  StrozzMobile:
    build:
      targets:
        StrozzMobile: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - StrozzMobileTests
        - StrozzMobileUITests
    archive:
      config: Release
  Strozz:
    build:
      targets:
        Strozz: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - StrozzTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  StrozzUI:
    build:
      targets:
        Strozz: all
    test:
      config: Debug
      targets:
        - StrozzUITests

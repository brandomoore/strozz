name: Strozz
options:
  # Preserve the shipping Apple identity so Strozz updates the existing app.
  bundleIdPrefix: com.thatcube.Twozz
  deploymentTarget:
    tvOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.37.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: Strozz/App/Info.plist
    TARGETED_DEVICE_FAMILY: "3" # Apple TV
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
packages:
  SDWebImage:
    url: https://github.com/SDWebImage/SDWebImage.git
    from: 5.21.0
  SDWebImageSwiftUI:
    url: https://github.com/SDWebImage/SDWebImageSwiftUI.git
    from: 3.1.3
  SDWebImageWebPCoder:
    url: https://github.com/SDWebImage/SDWebImageWebPCoder.git
    from: 0.14.6
targets:
  Strozz:
    type: application
    platform: tvOS
    sources:
      - path: Strozz
    dependencies:
      - package: SDWebImage
        product: SDWebImage
      - package: SDWebImageSwiftUI
        product: SDWebImageSwiftUI
      - package: SDWebImageWebPCoder
        product: SDWebImageWebPCoder
      - target: TopShelfExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thatcube.Twozz
        DEVELOPMENT_TEAM: N8Z5T4AK3X
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Strozz/App/Strozz.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  TopShelfExtension:
    type: com.apple.product-type.tv-app-extension
    platform: tvOS
    sources:
      - path: TopShelfExtension/ContentProvider.swift
      - path: TopShelfExtension/TopShelfLiveFeed.swift
      - path: Strozz/Shared/TopShelfSnapshot.swift
      - path: Strozz/Shared/TopShelfStore.swift
      - path: Strozz/Shared/TopShelfCredentialStore.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thatcube.Twozz.TopShelfExtension
        DEVELOPMENT_TEAM: N8Z5T4AK3X
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: TopShelfExtension/Info.plist
        # tvOS's legacy TVExtensionMain entry point (set by the
        # com.apple.product-type.tv-app-extension product type) is a no-op stub
        # in modern tvOS — it simply returns, so the extension process launched
        # and exited immediately without ever instantiating the principal class,
        # leaving the Top Shelf empty. Modern Top Shelf extensions must enter
        # through NSExtensionMain (provided by Foundation), which sets up the
        # ExtensionKit/XPC runtime and instantiates ContentProvider.
        LD_ENTRY_POINT: _NSExtensionMain
        CODE_SIGN_ENTITLEMENTS: TopShelfExtension/TopShelfExtension.entitlements
  StrozzTests:
    type: bundle.unit-test
    platform: tvOS
    sources:
      - path: StrozzTests
    dependencies:
      - target: Strozz
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thatcube.Twozz.Tests
        DEVELOPMENT_TEAM: N8Z5T4AK3X
        CODE_SIGN_STYLE: Automatic
        # These pure-logic tests use `@testable import Strozz`, so the bundle is
        # hosted by the app. Override the project-wide Info.plist settings, which
        # point at the app's own plist, with a generated one for the test bundle.
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: ""
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Strozz.app/Strozz"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Strozz:
    build:
      targets:
        Strozz: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - StrozzTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
